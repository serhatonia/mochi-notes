name: Linux build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux windowing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libinput-dev \
            libudev-dev \
            libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: mochi-notes-linux
          path: target/release/mochi-notes
          if-no-files-found: error

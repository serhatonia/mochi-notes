[package]
name = "mochi-notes"
version = "1.0.0"
edition = "2021"
description = "A cozy, pastel note-taking app built with pure Rust and Iced"
authors = ["Mochi Notes"]

[dependencies]
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "crisp",
    "thread-pool",
    "tokio",
    "canvas",
    "markdown",
    "x11",
    "wayland",
] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
rfd = "0.18"
dirs = "7"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
